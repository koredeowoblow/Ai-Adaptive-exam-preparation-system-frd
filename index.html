<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAdapt — AI Exam Preparation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400;1,9..40,500;1,9..40,600&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = saved === 'dark' || (!saved && prefersDark) || (saved === 'system' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', effective);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Seamless theme background to prevent any flash */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #ffffff;
        color: #0b2239;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html[data-theme='dark'], html[data-theme='dark'] body {
        background-color: #0b1726;
        color: #f8fafc;
      }

      /* Instant brand loader inside #root before React bundle loads */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
      }
      html[data-theme='dark'] #initial-loader {
        background-color: #0b1726;
      }
      .initial-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .initial-loader-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background-color: #0e6ba8;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(14, 107, 168, 0.25);
      }
      .initial-loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(14, 107, 168, 0.18);
        border-top-color: #0e6ba8;
        border-radius: 50%;
        animation: initial-spin 0.8s linear infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" role="status" aria-label="Loading EduAdapt">
        <div class="initial-loader-content">
          <div class="initial-loader-logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path>
              <path d="M22 10v6"></path>
              <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
            </svg>
          </div>
          <div class="initial-loader-spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
