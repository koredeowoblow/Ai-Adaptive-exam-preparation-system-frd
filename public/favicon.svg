<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect width="64" height="64" rx="15" fill="url(#eduGrad)" />
  <!-- Inner Glow / Border -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  
  <!-- Graduation Cap -->
  <g filter="url(#shadow)">
    <!-- Cap Skull Base -->
    <path d="M20 33 V41 C20 46.5, 44 46.5, 44 41 V33" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Mortarboard Diamond Top -->
    <path d="M32 17 L52 26.5 L32 36 L12 26.5 Z" fill="#ffffff" />
    
    <!-- Tassel Ribbon & Drop -->
    <path d="M47.5 29 V42 M46 42 H49" stroke="url(#tasselGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="32" cy="26.5" r="2.2" fill="#0369a1" />
  </g>
  
  <!-- AI Adaptive Sparkle (top right) -->
  <path d="M50 9 Q50 15 56 15 Q50 15 50 21 Q50 15 44 15 Q50 15 50 9 Z" fill="#fbbf24" />
</svg>